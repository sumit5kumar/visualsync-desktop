<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self' file:" />
    <title>VisualSync Desktop · Preview</title>
    <style>
      :root { color-scheme: dark; background: #030912; font-family: Inter, Segoe UI, sans-serif; } * { box-sizing: border-box; } body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 80% 5%, #123b4c, #030912 55%); } main { width: min(100vw, 1180px); padding: 22px; } .frame { overflow: hidden; border: 1px solid rgba(139, 233, 248, .18); border-radius: 18px; background: #02060c; box-shadow: 0 28px 80px rgba(0,0,0,.42); } video { display: block; width: 100%; max-height: calc(100vh - 142px); background: #02060c; } .empty { min-height: min(56vw, 500px); display: grid; place-items: center; padding: 28px; color: #94aabd; text-align: center; font-size: 14px; line-height: 1.55; } .actions { display: grid; place-items: center; margin-top: 17px; } button { min-width: 190px; border: 0; border-radius: 12px; padding: 13px 18px; cursor: pointer; background: #8eeefa; color: #062032; font: 700 14px Inter, Segoe UI, sans-serif; transition: transform .16s ease, filter .16s ease; } button:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); } button:disabled { cursor: wait; opacity: .58; } .sr-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
  </head>
  <body>
    <main>
      <div class="frame"><video id="outputVideo" controls preload="metadata"></video><div id="emptyState" class="empty">Loading local output…</div></div>
      <div class="actions"><button id="renderButton" type="button">Render video</button></div>
      <div id="status" class="sr-status" aria-live="polite"></div>
    </main>
    <script type="module" src="./desktop-preview.js"></script>
  </body>
</html>
